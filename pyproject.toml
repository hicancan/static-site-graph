[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "static-site-graph"
version = "0.1.0"
description = "Generic SiteDefinition to SitePackage crawler for static and semi-static websites"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "requests>=2.31",
  "lxml>=5.0",
  "PyYAML>=6.0",
  "jsonschema>=4.20"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
sitegraph = "sitegraph.cli:main"

[tool.setuptools.package-data]
"sitegraph.package_contract" = ["*.json"]
